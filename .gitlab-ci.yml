workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $CI_COMMIT_BRANCH == "main"

stages:
  - check
  - build
  - release

variables:
  CARGO_TERM_COLOR: always

.rust_linux_template:
  image: rust:latest
  before_script:
    - apt-get update -yqq
    - apt-get install -yqq pkg-config libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libx11-dev libxcb1-dev libxext-dev libxrender-dev libxi-dev libxrandr-dev libxcursor-dev libgl1-mesa-dev build-essential curl

check:
  extends: .rust_linux_template
  stage: check
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - cargo clippy --workspace --all-targets -- -D warnings
    - cargo test --workspace

build:
  extends: .rust_linux_template
  stage: build
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  cache:
    key: linux-release
    paths:
      - target/
      - .cargo/
  script:
    - cargo test --release
    - cargo build --release
    - |
      URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/ram_ui/${CI_COMMIT_TAG}/ram_ui"
      curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file target/release/ram_ui "${URL}"

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  needs: [build]
  script:
    - echo "Creating release $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "Release $CI_COMMIT_TAG"
    description: "See [CHANGELOG.md]($CI_PROJECT_URL/-/blob/main/CHANGELOG.md) for details."
    assets:
      links:
        - name: ram_ui
          url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/ram_ui/$CI_COMMIT_TAG/ram_ui"
